<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Archive · AI News (working title)</title>
  <meta name="description" content="Every AI news entry, filterable by month, company, category, and importance.">
  <link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="aura" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="site-header">
    <nav class="nav glass" aria-label="Main">
      <a class="wordmark" href="./">AI News</a>
      <a class="nav-link" href="./">Timeline</a>
      <span class="nav-link soon" aria-disabled="true" title="Coming soon">This Week in AI</span>
      <a class="nav-link" href="archive.html" aria-current="page">Archive</a>
      <a class="nav-link" href="glossary.html">Glossary</a>
      <span class="nav-link soon" aria-disabled="true" title="Coming soon">Companies</span>
    </nav>
  </header>

  <main class="main">
    <div class="page-head">
      <h1>Archive</h1>
      <p class="stats" id="stats"></p>
    </div>

    <form class="filters glass" id="filters" aria-label="Filter entries">
      <div class="filter">
        <label for="filter-month">Month</label>
        <select id="filter-month"><option value="">Any month</option></select>
      </div>
      <div class="filter">
        <label for="filter-company">Company</label>
        <select id="filter-company"><option value="">Any company</option></select>
      </div>
      <div class="filter">
        <label for="filter-category">Category</label>
        <select id="filter-category"><option value="">Any category</option></select>
      </div>
      <div class="filter">
        <label for="filter-importance">Importance</label>
        <select id="filter-importance"><option value="">Any importance</option></select>
      </div>
      <div class="filter-summary">
        <p class="result-count" id="result-count" role="status"></p>
        <button class="button" id="clear-filters" type="button" disabled>Clear filters</button>
      </div>
    </form>

    <div class="archive" id="archive" aria-live="polite">
      <p class="status">Loading…</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Summaries are written in plain English from each company's own announcements. They can contain mistakes, so check the linked sources.</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/archive.js"></script>
</body>
</html>
